<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/mantine-design-system-bdb30156-1a6b-4162-8181-1c297f319a1c/tokens/colors.css">
<link rel="stylesheet" href="_ds/mantine-design-system-bdb30156-1a6b-4162-8181-1c297f319a1c/tokens/semantic.css">
<link rel="stylesheet" href="_ds/mantine-design-system-bdb30156-1a6b-4162-8181-1c297f319a1c/tokens/typography.css">
<link rel="stylesheet" href="_ds/mantine-design-system-bdb30156-1a6b-4162-8181-1c297f319a1c/tokens/spacing.css">
<link rel="stylesheet" href="_ds/mantine-design-system-bdb30156-1a6b-4162-8181-1c297f319a1c/tokens/base.css">
<link rel="stylesheet" href="_ds/mantine-design-system-bdb30156-1a6b-4162-8181-1c297f319a1c/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.24.0/dist/tabler-icons.min.css">
<style>
  body{margin:0;background:#efeafb;}
  a{color:#1971c2;} a:hover{color:#1864ab;}
  .dv-chip{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:11px;cursor:pointer;
    font-size:13.5px;font-weight:700;white-space:nowrap;color:#5d5880;background:#fff;
    border:1.5px solid #dee2e6;transition:background .14s ease,border-color .14s ease,color .14s ease;}
  .dv-chip:hover{border-color:#c3c9d2;color:#211a4a;}
  .dv-chip-on,.dv-chip-on:hover{background:#e7f5ff;border-color:#228be6;color:#1864ab;}
  .dv-ico{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:10px;cursor:pointer;
    background:#fff;border:1.5px solid #dee2e6;color:#5d5880;transition:background .14s ease,color .14s ease;}
  .dv-ico:hover{background:#f8f9fa;color:#211a4a;}
  .dv-lbl{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#868e96;}
</style>
</helmet>

<div style="min-height:100vh;padding:26px 24px 48px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <div style="max-width:1180px;margin:0 auto;">

    <div style="display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:22px;">
      <div style="flex:1;min-width:260px;">
        <h1 style="margin:0 0 6px;font-size:30px;font-weight:700;letter-spacing:-.02em;color:#211a4a;">Device preview</h1>
        <p style="margin:0;font-size:15px;font-weight:500;color:#5d5880;line-height:1.5;max-width:560px;text-wrap:pretty;">A real iframe at the chosen size, so the page sees a genuine viewport — media queries and breakpoints behave exactly as they would on the device.</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="dv-ico" onClick="{{ rotate }}" title="Rotate"><i class="ti ti-rotate-rectangle" style="font-size:19px;"></i></div>
        <div class="dv-ico" onClick="{{ reload }}" title="Reload"><i class="ti ti-refresh" style="font-size:19px;"></i></div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:8px;">
      <span class="dv-lbl">Page</span>
      <div style="display:flex;gap:9px;flex-wrap:wrap;">
        <sc-for list="{{ pages }}" as="p" hint-placeholder-count="3">
          <div class="dv-chip {{ p.cls }}" onClick="{{ p.pick }}">{{ p.label }}</div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:26px;">
      <span class="dv-lbl">Device</span>
      <div style="display:flex;gap:9px;flex-wrap:wrap;">
        <sc-for list="{{ devices }}" as="d" hint-placeholder-count="4">
          <div class="dv-chip {{ d.cls }}" onClick="{{ d.pick }}">{{ d.label }}<span style="font-weight:600;color:#868e96;">{{ d.dims }}</span></div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;justify-content:center;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">

        <!-- iPhone: the ios-frame starter owns the bezel, status bar and home indicator.
             The iframe is inset by the real safe-area values so the page renders where a
             device would actually give it, instead of sliding under the island. -->
        <sc-if value="{{ isIOS }}" hint-placeholder-val="{{ true }}">
          <!-- IOSDevice draws only the screen, not a phone body, so the iOS presets would read
               as flat rectangles beside the Android one. The same bezel shell wraps it. -->
          <div style="flex:none;border-radius:{{ shellR }};padding:{{ bezel }};line-height:0;
            background:linear-gradient(160deg,#2b2740 0%,#15121f 46%,#282438 100%);
            box-shadow:0 34px 70px -26px rgba(33,26,74,.55),0 3px 10px rgba(33,26,74,.24),inset 0 1px 0 rgba(255,255,255,.18);">
            <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx"
              width="{{ vw }}" height="{{ vh }}" hint-size="390px,844px">
              <!-- The safe-area reserve carries the app's own gradient, so the status-bar and
                   home-indicator regions read as the page continuing behind the chrome rather
                   than flat bands cutting the design off. -->
              <div style="width:100%;height:100%;padding-top:{{ safeTop }};padding-bottom:{{ safeBottom }};box-sizing:border-box;background:linear-gradient(180deg,#f3f0ff 0%,#f8f9fa 52%,#fff4e6 100%);">
                <iframe src="{{ src }}" title="Device preview" style="display:block;width:100%;height:100%;border:0;background:transparent;"></iframe>
              </div>
            </x-import>
          </div>
        </sc-if>

        <!-- Android / tablet: same safe-area contract, with a plain status strip -->
        <sc-if value="{{ isOther }}" hint-placeholder-val="{{ false }}">
          <div style="position:relative;flex:none;width:{{ shellW }};height:{{ shellH }};border-radius:{{ shellR }};padding:{{ bezel }};
            background:linear-gradient(160deg,#2b2740 0%,#15121f 46%,#282438 100%);
            box-shadow:0 34px 70px -26px rgba(33,26,74,.55),0 3px 10px rgba(33,26,74,.24),inset 0 1px 0 rgba(255,255,255,.18);">
            <!-- Status strip overlays the page rather than sitting above it in flow, so this
                 shell is full-bleed like the iOS one and no band interrupts the design. -->
            <div style="position:relative;width:100%;height:100%;border-radius:{{ screenR }};overflow:hidden;background:linear-gradient(180deg,#f3f0ff 0%,#f8f9fa 52%,#fff4e6 100%);">
              <iframe src="{{ src }}" title="Device preview" style="display:block;width:100%;height:100%;border:0;background:transparent;"></iframe>
              <div style="position:absolute;left:0;right:0;top:0;height:28px;z-index:3;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#211a4a;font-size:12.5px;font-weight:700;">
                <span>9:41</span>
                <span style="display:inline-flex;align-items:center;gap:6px;"><i class="ti ti-wifi" style="font-size:14px;"></i><i class="ti ti-battery-3" style="font-size:15px;"></i></span>
              </div>
            </div>
          </div>
        </sc-if>

        <div style="font-size:13px;font-weight:700;color:#6b6786;">{{ caption }}</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:1120}}">
class Component extends DCLogic {
  state = { device:'iphone14', page:'Home Page.dc.html', landscape:false, nonce:0 };

  componentDidMount(){ this._pushInsets(); this._t = setInterval(() => this._pushInsets(), 600); }
  componentWillUnmount(){ clearInterval(this._t); }
  componentDidUpdate(){ this._pushInsets(); }

  /* The framed page is same-origin, so the real chrome bands are written onto its
     documentElement as custom properties. env(safe-area-inset-*) is always 0 inside an
     iframe, so this is the only way the page can know where the island and the home
     indicator are. Background still bleeds edge to edge; only content insets. */
  _pushInsets(){
    try{
      const el = document.querySelector('iframe'); if(!el) return;
      const doc = el.contentDocument; if(!doc || !doc.documentElement) return;
      const d = this._dev || {};
      /* Landscape gets a much smaller top reserve, matching real iOS where the top inset is
         ~0 once rotated — holding the portrait 62px there starved the hero of the height it
         needs and pushed the resume cards under the composer. */
      const land = !!this.state.landscape;
      const top = d.ios ? (land ? 20 : 62) : (land ? 0 : (d.safeTop || 0));
      const bottom = d.ios ? (land ? 21 : 34) : (d.safeBottom || 0);
      const r = doc.documentElement.style;
      if(r.getPropertyValue('--dp-safe-top') !== top + 'px'){
        r.setProperty('--dp-safe-top', top + 'px');
        r.setProperty('--dp-safe-bottom', bottom + 'px');
      }
    }catch(e){}
  }

  renderVals(){
    const st = this.state;

    /* Real device viewports. The iframe is given these exact pixel dimensions, so the page
       inside resolves its own breakpoints — no faking window.innerWidth from outside. */
    /* safeTop / safeBottom are the real reserved regions — the status bar / dynamic island
       and the home-indicator strip. The iframe is inset by them, so the page renders in the
       area the OS would actually hand it rather than sliding under the chrome. */
    /* The iOS reserve is measured from ios-frame.jsx's own chrome, not from the real device:
       the starter pins its island at top:11 height:37 and its status row at top:0 height:62,
       and neither is orientation-aware. So the inset is a constant 62 for every iOS preset in
       both orientations — assuming the island moves aside in landscape is what re-exposed it. */
    /* Full-bleed, the way a real app renders: the page's own background runs edge to edge and
       the status bar / home indicator float over it. Insetting the iframe instead left flat
       bands top and bottom whose gradient stops could never line up with the page's.
       The chrome the page must avoid is published to it via _pushInsets, because
       env(safe-area-inset-*) resolves to 0 inside an iframe. */
    const IOS_TOP = 0, IOS_BOTTOM = 0;
    const DEV = [
      { id:'iphoneSE', label:'iPhone SE', w:375, h:667, r:44, bezel:11, ios:true },
      { id:'iphone14', label:'iPhone 14', w:390, h:844, r:52, bezel:12, ios:true },
      { id:'pixel7',   label:'Pixel 7',   w:412, h:915, r:44, bezel:12, ios:false, safeTop:28, safeBottom:0 },
      { id:'ipadMini', label:'iPad mini', w:744, h:1030, r:34, bezel:14, ios:false, safeTop:24, safeBottom:0 },
    ];
    const d = DEV.find(x => x.id === st.device) || DEV[1];
    this._dev = d;
    const land = st.landscape;
    const vw = land ? d.h : d.w, vh = land ? d.w : d.h;
    const bez = d.bezel;

    const PAGES = [
      { id:'Home Page.dc.html', label:'Home' },
      { id:'Chapter Journey - L&P.dc.html', label:'Chapter Journey' },
      { id:'Profile.dc.html', label:'Profile' },
    ];

    return {
      devices: DEV.map(x => ({ key:x.id, label:x.label, dims:x.w + '×' + x.h,
        cls: x.id === st.device ? 'dv-chip-on' : '',
        pick: () => this.setState({ device:x.id }) })),
      pages: PAGES.map(p => ({ key:p.id, label:p.label,
        cls: p.id === st.page ? 'dv-chip-on' : '',
        pick: () => this.setState({ page:p.id }) })),

      // cache-busting the src is what makes Reload actually re-run the page's scripts
      src: encodeURI(st.page) + (st.nonce ? (st.page.indexOf('?') < 0 ? '?' : '&') + '_r=' + st.nonce : ''),
      shellW: (vw + bez * 2) + 'px',
      shellH: (vh + bez * 2) + 'px',
      shellR: (d.r + 4) + 'px',
      screenR: d.r + 'px',
      bezel: bez + 'px',
      isIOS: d.ios, isOther: !d.ios,
      vw, vh,
      safeTop: (d.ios ? IOS_TOP : d.safeTop) + 'px',
      safeBottom: (d.ios ? IOS_BOTTOM : d.safeBottom) + 'px',
      caption: d.label + ' · ' + vw + ' × ' + vh + (land ? ' · landscape' : ''),

      rotate: () => this.setState(s => ({ landscape: !s.landscape })),
      reload: () => this.setState(s => ({ nonce: s.nonce + 1 })),
    };
  }
}
</script>
</body>
</html>
